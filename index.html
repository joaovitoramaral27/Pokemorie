<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokemorie</title>
    <link rel="icon" type="image/x-icon" href="Img/PokemorieLogo.png">
    <link rel="stylesheet" href="Css/style.css">
</head>
<body>
    <header>
        <section class="logo">
            <picture>
                <source srcset="Img/PokemorieLogo.png" type="image">
                <img src="Img/PokemorieLogo.png" alt="Pokemorie Logo">
            </picture>
            <h1>Pokemorie</h1>
        </section>
        <section class="game-buttons">
            <button id="dailygame">
                Daily Game
            </button>
            <button id="unlimitedgame">
                Unlimited Game
            </button>
            <button id="tiktok" href="https://www.tiktok.com/@mudz679">
                <img src="Img/TikTokLogo.png" alt="TikTok Logo">
            </button>
        </section>
    </header>
</body>
</html>
